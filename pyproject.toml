[project]
name = "hackathon-advisor"
version = "0.1.0"
description = "Text-first originality advisor for small-model project ideas."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Jacob LinCool" }]
dependencies = [
  "accelerate>=1.0,<2",
  "Cython>=3,<4",
  "gradio>=6.16.0,<7",
  "huggingface-hub>=0.36,<1",
  "llama-cpp-python>=0.3.26,<1",
  "nemo_toolkit[asr]==2.7.3",
  "numpy>=2,<3",
  "packaging>=24,<26",
  "peft>=0.13,<1",
  "pillow>=10,<13",
  "requests>=2.32,<3",
  "scikit-learn>=1.5,<2",
  "spaces>=0.50,<1",
  "torch>=2.8,<3",
  "transformers>=4.55,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9",
]
model = [
  "accelerate>=1.0,<2",
  "Cython>=3,<4",
  "llama-cpp-python>=0.3.26,<1",
  "nemo_toolkit[asr]==2.7.3",
  "numpy>=2,<3",
  "packaging>=24,<26",
  "peft>=0.13,<1",
  "spaces>=0.50,<1",
  "scikit-learn>=1.5,<2",
  "torch>=2.8,<3",
  "transformers>=4.55,<5",
]
train = [
  "accelerate>=1.0,<2",
  "huggingface-hub>=0.36,<1",
  "peft>=0.13,<1",
  "torch>=2.8,<3",
  "transformers>=4.55,<5",
]
index = [
  "llama-cpp-python>=0.3.26,<1",
  "modal>=1.4,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
