[project]
name = "hackathon-advisor"
version = "0.1.0"
description = "Text-first originality advisor for small-model project ideas."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Jacob LinCool" }]
dependencies = [
  "gradio>=6.16.0,<7",
  "pillow>=10,<13",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9",
]
model = [
  "accelerate>=1.0,<2",
  "torch>=2.8,<3",
  "transformers>=4.55,<5",
]
train = [
  "accelerate>=1.0,<2",
  "peft>=0.13,<1",
  "torch>=2.8,<3",
  "transformers>=4.55,<5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
